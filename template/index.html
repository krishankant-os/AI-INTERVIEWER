<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interviewer</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-header">
    <div class="app-logo">
        <i class="fa-solid fa-brain"></i>
    </div>
    <h1>AI <span>Interviewer</span></h1>
</div>
    <div class="container">
        <!-- SCREEN 1: Setup Form -->
        <div id="setup-screen" class="card">
            <h2><i class="fa-solid fa-robot"></i> AI Interview Setup</h2>
            <form id="interview-form" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="job-role">Job Role</label>
                    <select id="job-role">
                        <option value="Software-Engineer">Software Engineer</option>
                        <option value="AI-Engineering">AI Engineer</option>
                        <option value="Backend-Developer">Backend Developer</option>
                        <option value="Software-tester">Software Tester</option>
                        <option value="DevOps-Developer">DevOps Developer</option>
                        <option value="Data-Analyst">Data Analyst</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="level">Difficulty Level</label>
                    <select id="level">
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

                <button type="submit" class="btn primary-btn">
                    <i class="fa-solid fa-play"></i> Start Interview
                </button>
            </form>
        </div>

        <!-- SCREEN 2: Interview Questions -->
        <div id="interview-screen" class="card hidden">
            <div class="interview-header">
                <h2>AI Interview Room</h2>
                <div class="question-tracker">
                    <span id="question-progress">Question --</span>
                </div>
            </div>
            
            <div id="question" class="question-box">Loading your question...</div>

            <!-- TTS Settings Controls -->
            <div class="tts-settings">
                <div class="setting-item">
                    <label for="voice-select">Voice</label>
                    <select id="voice-select"></select>
                </div>
                
                <div class="setting-item">
                    <label for="speech-rate">Speed: <span id="rate-display">1.0</span>x</label>
                    <input type="range" id="speech-rate" min="0.5" max="2.0" step="0.1" value="1.0" 
                           oninput="document.getElementById('rate-display').textContent = this.value">
                </div>

                <button type="button" class="btn icon-btn" onclick="speak_question()" title="Listen to question">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
            
            <div class="answer-container">
                <label for="answer">Your Answer</label>
                <textarea id="answer" placeholder="Type your answer here or click the mic button to speak..."></textarea>
                
                <div class="speech-controls">
                    <button type="button" id="stt-btn" class="btn mic-btn" onclick="toggleSpeechToText()">
                        <i class="fa-solid fa-microphone"></i> <span id="stt-btn-text">Speak Answer</span>
                    </button>
                </div>
            </div>

            <div class="interview-actions">
                <button id="submit-answer-btn" class="btn primary-btn" onclick="submitAnswer()">
                    Submit Answer <i class="fa-solid fa-arrow-right"></i>
                </button>
                <button type="button" id="feedback_btn" class="btn success-btn hidden" onclick="feedback_func()">
                    <i class="fa-solid fa-square-poll-vertical"></i> View Results
                </button>
            </div>
        </div>

        <!-- SCREEN 3: Dynamic Feedback & Results Screen -->
        <div class="card hidden" id="feedback-screen">
            <h2>Interview Results & Feedback</h2>
            
            <!-- Summary Header -->
            <div class="feedback-header">
                <div class="score-badge">
                    <span id="overall-score">--</span>
                </div>
                <p id="candidate-greeting">Great job! Here is your performance overview.</p>
            </div>

            <!-- Category Breakdown Metrics -->
            <div class="metrics-container">
                <h3>Performance Breakdown</h3>
                
                <div class="metric-item">
                    <span>Technical Accuracy</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="tech-score-bar" style="width: 0%;"></div>
                    </div>
                    <span id="tech-score-text">0%</span>
                </div>

                <div class="metric-item">
                    <span>Communication & Clarity</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="comm-score-bar" style="width: 0%;"></div>
                    </div>
                    <span id="comm-score-text">0%</span>
                </div>

                <div class="metric-item">
                    <span>Problem Solving</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="problem-score-bar" style="width: 0%;"></div>
                    </div>
                    <span id="problem-score-text">0%</span>
                </div>
            </div>

            <!-- Detailed Question-by-Question List -->
            <div class="questions-summary">
                <h3>Question Breakdown</h3>
                <div id="questions-feedback-list">
                    <!-- Dynamically injected via JS -->
                </div>
            </div>

            <!-- Actions -->
            <div class="action-buttons">
                <button type="button" class="btn primary-btn" onclick="restartInterview()">
                    <i class="fa-solid fa-rotate-left"></i> Retake Interview
                </button>
                <button type="button" class="btn secondary-btn" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> Download Report
                </button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
